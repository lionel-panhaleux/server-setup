[project]
name = "server-setup"
version = "2.0.1"
requires-python = ">=3.13"
dependencies = ["pyinfra>=3.10,<4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server_setup"]

[tool.ruff]
line-length = 120
