---
- name: Verify nginx_site
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: nginx config must parse cleanly
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Each site is enabled
      ansible.builtin.stat:
        path: "/etc/nginx/sites-enabled/{{ item }}.conf"
      register: site_stat
      loop:
        - mol_static
        - mol_plain
        - mol_spa
        - mol_proxy
        - mol_api

    - name: Symlinks resolve to sites-available
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.islnk
      loop: "{{ site_stat.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the open-API site config
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/mol_api.conf
      register: mol_api_conf

    - name: Whole-site CORS proxies the root location exactly once
      ansible.builtin.assert:
        that:
          - "'Access-Control-Allow-Origin' in _conf"
          - _conf | regex_findall('location / \{') | length == 2  # one per server (80 redirect + 443)
      vars:
        _conf: "{{ mol_api_conf.content | b64decode }}"

    - name: Read the plain-HTTP site config
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/mol_plain.conf
      register: mol_plain_conf

    - name: A whole-site plain-HTTP path replaces the redirect
      ansible.builtin.assert:
        that:
          - "'return 301' not in _conf"
          - _conf | regex_findall('location / \{') | length == 2  # one per server (80 plain + 443)
      vars:
        _conf: "{{ mol_plain_conf.content | b64decode }}"

    - name: Request the plain-HTTP site over port 80
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: plain.molecule.test
        follow_redirects: none
        return_content: true
      register: mol_plain_http

    - name: Port 80 serves the content, not a redirect
      ansible.builtin.assert:
        that:
          - mol_plain_http.status == 200
          - "'ok' in mol_plain_http.content"

# A consuming play must survive `--check`. `nginx -v` is a command, which ansible
# skips under check mode unless the task opts out, and the empty register used to
# kill the play at the version parse — before anything was ever diffed. Dry-run the
# whole role over an already-converged site: it has to reach the end.
- name: Verify nginx_site survives a dry run
  hosts: all
  gather_facts: false
  become: true
  check_mode: true
  tasks:
    - name: Deploy the proxy site again, dry
      ansible.builtin.include_role:
        name: nginx_site
      vars:
        nginx_site_name: mol_proxy
        nginx_site_domain: proxy.molecule.test
        nginx_site_type: proxy
        nginx_site_upstream: "http://127.0.0.1:8000"

    # proxy.molecule.test is covered, current, and carries the renewal conf certbot
    # writes for this role's own webroot: nothing to issue, expand or repair, so a
    # dry run must not report certbot at all. A task skipped by its condition never
    # builds `cmd`; check mode's own "would have run" skip does — which is what
    # every dry run used to report, when the SAN read was skipped under --check.
    - name: A covered cert on this role's webroot reports no certbot run
      ansible.builtin.assert:
        that:
          - not nginx_site_renewal_stale | bool
          - nginx_site_certbot.cmd is not defined
        fail_msg: >-
          The dry run would have run certbot for a covered, current cert.
          Got: {{ nginx_site_certbot }}

    # A site's first deploy is the dry run most worth reviewing, and the one where
    # nothing exists yet: the config is not written, so the link has no target.
    - name: Deploy a site never deployed before, dry
      ansible.builtin.include_role:
        name: nginx_site
      vars:
        nginx_site_name: mol_new
        nginx_site_domain: new.molecule.test
        nginx_site_type: spa
        nginx_site_root: /srv/site-root

    - name: The first-deploy dry run reaches the certificate request
      ansible.builtin.assert:
        that:
          - nginx_site_certbot.cmd is defined
        fail_msg: "Got: {{ nginx_site_certbot }}"

# The codex-beta case: a site moved onto this role from a deploy that served ACME
# from /usr/share/nginx/html. Its cert covers every name and is valid, so nothing
# looks wrong at deploy time — but certbot still writes renewal tokens where the
# vhost no longer serves them, and the cert silently lapses.
- name: Simulate a renewal conf inherited from an older deploy
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Point the proxy site's renewal conf at a legacy webroot
      ansible.builtin.replace:
        path: /etc/letsencrypt/renewal/proxy.molecule.test.conf
        regexp: /var/www/certbot
        replace: /usr/share/nginx/html

- name: Verify nginx_site repairs a stale renewal webroot
  hosts: all
  gather_facts: false
  become: true
  check_mode: true
  tasks:
    - name: Deploy the proxy site again, dry
      ansible.builtin.include_role:
        name: nginx_site
      vars:
        nginx_site_name: mol_proxy
        nginx_site_domain: proxy.molecule.test
        nginx_site_type: proxy
        nginx_site_upstream: "http://127.0.0.1:8000"

    - name: The role re-issues through its own webroot, forced past "not due"
      ansible.builtin.assert:
        that:
          - nginx_site_renewal_stale | bool
          - nginx_site_certbot.cmd is defined
          - "'/var/www/certbot' in nginx_site_certbot.cmd"
          - "'--force-renewal' in nginx_site_certbot.cmd"
        fail_msg: >-
          A covered, valid cert whose renewal conf points at another webroot must
          be re-issued with --force-renewal, or its renewals keep failing.
          Got: {{ nginx_site_certbot }}
