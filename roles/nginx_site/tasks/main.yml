---
- name: Validate inputs
  ansible.builtin.assert:
    that:
      - nginx_site_name | length > 0
      - nginx_site_domain | length > 0
      - nginx_site_type in ["static", "spa", "proxy"]
      - (nginx_site_type != "proxy") or (nginx_site_upstream | length > 0)
      - (nginx_site_type == "proxy") or (nginx_site_root | length > 0)
    fail_msg: "nginx_site_name, nginx_site_domain, nginx_site_type and its companion (nginx_site_root or nginx_site_upstream) are required"

# nginx_site_name becomes a syslog tag (templates/site.conf.j2) — nginx rejects
# anything other than alphanumeric + underscore with a cryptic parse error.
- name: Validate nginx_site_name charset
  ansible.builtin.assert:
    that: nginx_site_name is match('^[A-Za-z0-9_]+$')
    fail_msg: >-
      nginx_site_name must contain only alphanumeric and underscore
      (it becomes an nginx syslog tag). Got: "{{ nginx_site_name }}"

# nginx < 1.25.1 (e.g. Debian 12's 1.22) predates the `http2 on;` directive
# and needs the legacy `listen ... http2` parameter (itself deprecated in
# newer nginx): detect the version once, the template picks the right syntax.
# `nginx -v` reads nothing and changes nothing, so it runs under --check as well:
# skipped there, it leaves the register empty and the version parse below kills
# every consuming play's dry run before the vhost is ever diffed.
- name: Detect nginx version
  ansible.builtin.command:
    cmd: nginx -v
  register: nginx_site_version
  changed_when: false
  check_mode: false

- name: Compute http2 directive style
  ansible.builtin.set_fact:
    nginx_site_modern_http2: >-
      {{ ((nginx_site_version.stderr ~ nginx_site_version.stdout)
          | regex_search('nginx/(\d+\.\d+(?:\.\d+)?)', '\1')
          | first) is version('1.25.1', '>=') }}

- name: Ensure certbot webroot
  ansible.builtin.file:
    path: /var/www/certbot
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Check for existing TLS certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_site_domain }}/fullchain.pem"
  register: nginx_site_cert

- name: Render site config (HTTP-only until cert exists)
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    mode: "0644"
  vars:
    cert_exists: "{{ nginx_site_cert.stat.exists }}"
  notify: Reload nginx

- name: Enable site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}.conf"
    state: link
  notify: Reload nginx

- name: Reload nginx before requesting certificate
  ansible.builtin.meta: flush_handlers

# A cert can exist but predate an alias change (e.g. an apex domain moved to
# this site as an alias): compare its SANs to the desired domain set and
# re-issue with --expand when any name is missing.
- name: Read certificate domain coverage
  ansible.builtin.command:
    cmd: >-
      openssl x509 -noout -ext subjectAltName
      -in /etc/letsencrypt/live/{{ nginx_site_domain }}/fullchain.pem
  register: nginx_site_cert_sans
  changed_when: false
  when: nginx_site_cert.stat.exists

# A cert can also cover every name and still be unable to renew. A site moved
# here from another deploy keeps that deploy's renewal conf, and with it the
# webroot certbot writes the challenge token to (e.g. /usr/share/nginx/html) —
# while this role's vhost serves the challenge from /var/www/certbot. Nothing
# fails at deploy time, the cert is valid; every unattended renewal then 404s
# until it expires. A conf pointing elsewhere is re-issued through this webroot
# below, which rewrites it. (No conf at all is not certbot's cert to repair.)
- name: Read certificate renewal configuration
  ansible.builtin.slurp:
    src: "/etc/letsencrypt/renewal/{{ nginx_site_domain }}.conf"
  register: nginx_site_renewal_conf
  failed_when: false
  when: nginx_site_cert.stat.exists

- name: Check the renewal webroot is the one this vhost serves
  ansible.builtin.set_fact:
    nginx_site_renewal_stale: >-
      {{ _conf | length > 0 and (
           (_conf | regex_search('(?m)^authenticator\s*=\s*(\S+)', '\1')
                  | default([''], true) | first) != 'webroot'
           or (_webroots | reject('equalto', '/var/www/certbot') | list | length > 0)
         ) }}
  vars:
    _conf: "{{ (nginx_site_renewal_conf.content | default('')) | b64decode }}"
    # renewal reads the per-domain [[webroot_map]], the conf's last section
    _webroots: >-
      {{ (_conf.split('[[webroot_map]]') + [''])[1]
         | regex_findall('(?m)^\S+\s*=\s*(\S+)\s*$') }}

- name: Request Let's Encrypt certificate (issue, expand for new aliases, or repair renewal)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot -w /var/www/certbot
      --cert-name {{ nginx_site_domain }}
      -d {{ nginx_site_domain }}
      {% for a in nginx_site_aliases + nginx_site_cert_extra_domains %}-d {{ a }} {% endfor %}
      --expand {{ '--force-renewal' if nginx_site_renewal_stale | bool else '' }}
      --non-interactive --agree-tos --register-unsafely-without-email
  vars:
    nginx_site_cert_covered: >-
      {{ (nginx_site_cert_sans.stdout | default(''))
         | regex_findall('DNS:([^,\s]+)') }}
  when: >-
    not nginx_site_cert.stat.exists or
    (([nginx_site_domain] + nginx_site_aliases + nginx_site_cert_extra_domains)
     | difference(nginx_site_cert_covered) | length > 0) or
    nginx_site_renewal_stale | bool
  register: nginx_site_certbot
  # The `when` above lets this run to issue a cert, expand one missing a name, or
  # repair a stale renewal conf. A repair is forced: the cert covers the names and
  # is usually not due, so certbot would otherwise decline and leave the conf as
  # it is. (`certbot reconfigure` would avoid the issuance, but only exists from
  # certbot 2.3 and Debian 12 ships 2.1; the forced renewal is the documented way
  # there, and it runs once — the rewritten conf no longer matches this check.)
  # Otherwise certbot can still find nothing to do — a cert that covers the names
  # and is not due — and says so rather than reissuing; take it at its word
  # instead of reporting a change and reloading nginx for it.
  # (An empty stdout is the check-mode skip: a dry run reports the issuance it
  # would have performed.)
  changed_when: "'no action taken' not in (nginx_site_certbot.stdout | default('', true))"
  notify: Reload nginx

- name: Re-check certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ nginx_site_domain }}/fullchain.pem"
  register: nginx_site_cert

- name: Render final site config with HTTPS
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}.conf"
    mode: "0644"
  vars:
    cert_exists: "{{ nginx_site_cert.stat.exists }}"
  notify: Reload nginx
