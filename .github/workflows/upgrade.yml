name: Distribution Upgrade

on:
  workflow_dispatch:
    inputs:
      host:
        description: Inventory hostname to target
        required: true
        type: choice
        options:
          - gravelines
          - strasbourg
          - frankfurt
      confirm:
        description: Execute the upgrade (unchecked = check only)
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.host }}
  cancel-in-progress: false

jobs:
  upgrade:
    name: Run distribution upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: Run upgrade
        env:
          CONFIRM: ${{ inputs.confirm && '1' || '' }}
        run: uv run pyinfra inventory.py deploys/upgrade.py --limit "${{ inputs.host }}" -y
