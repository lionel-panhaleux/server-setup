name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Unit tests
        run: uv run pytest

      - name: Install nginx, postgresql and sshd
        run: sudo apt-get update && sudo apt-get install -y nginx postgresql openssh-server

      - name: Every site variant passes nginx -t
        run: |
          mkdir -p /tmp/sites
          uv run python tests/test_nginx_site.py /tmp/sites
          sudo cp /tmp/sites/*.conf /etc/nginx/sites-enabled/
          sudo cp server_setup/files/nginx-upgrade-map.conf /etc/nginx/conf.d/upgrade_map.conf
          sudo cp server_setup/files/nginx-default-server.conf /etc/nginx/conf.d/default_server.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          for conf in /tmp/sites/*.conf; do
            domain=$(grep -m1 -oP 'server_name \K\S+(?=;)' "$conf")
            sudo mkdir -p "/etc/letsencrypt/live/$domain"
            sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$domain" \
              -keyout "/etc/letsencrypt/live/$domain/privkey.pem" \
              -out "/etc/letsencrypt/live/$domain/fullchain.pem"
          done
          sudo nginx -t

      - name: sshd accepts the hardened config
        run: sudo sshd -t -f server_setup/files/sshd_config

      - name: postgres_db converges, twice
        run: |
          sudo systemctl start postgresql
          uv run pyinfra @local tests/converge.py -y
          uv run pyinfra @local tests/converge.py -y
          settings=$(sudo -u postgres psql -tAc "SELECT unnest(setconfig) FROM pg_db_role_setting s JOIN pg_database d ON d.oid = s.setdatabase WHERE d.datname = 't_db'")
          echo "$settings"
          grep -qx 'statement_timeout=15s' <<< "$settings"
          grep -qx 'lock_timeout=5s' <<< "$settings"
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE d.datname = 't_db' AND r.rolname = 't_owner'" | grep -qx 1
