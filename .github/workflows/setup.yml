name: Server Setup

on:
  workflow_dispatch:
    inputs:
      host:
        description: Inventory hostname to target
        required: true
        type: choice
        options:
          - gravelines
          - strasbourg
          - frankfurt

concurrency:
  group: ${{ inputs.host }}
  cancel-in-progress: false

jobs:
  setup:
    name: Run system setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install sops
        run: |
          sudo curl -sSLo /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sudo chmod +x /usr/local/bin/sops

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

      - name: Run setup
        run: SOPS_AGE_SSH_PRIVATE_KEY_FILE="$HOME/.ssh/deploy" uv run pyinfra inventory.py deploys/setup.py --limit "${{ inputs.host }}" -y
