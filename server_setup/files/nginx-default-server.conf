# Managed by server-setup. A request for a name no site serves gets no site:
# port 80 closes the connection, port 443 refuses the TLS handshake instead of
# presenting another site's certificate. Port 80 answers ACME challenges, so a
# certificate can be issued before its site exists.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}
