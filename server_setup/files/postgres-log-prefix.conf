# Managed by server-setup.
# Debian's cluster wrapper otherwise logs to /var/log/postgresql, which Alloy never
# reads; journald takes long lines, so no splitting.
log_destination = 'syslog'
syslog_split_messages = off
# %u@%d puts the database name in every session log line so
# `journalctl -u postgresql -g "@<db>"` scopes engine logs to that DB, and %a names
# the connection's application.
log_line_prefix = '[%p] %q%a %u@%d '
