# Managed by server-setup.
# BBR paces by measured bandwidth and RTT instead of halving on every loss: mobile
# links drop packets without being full. fq is the pacing qdisc it pairs with; it
# takes over an interface's root qdisc from the next boot.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Keep a connection's congestion window across idle gaps: a reader's next click
# on a kept-alive connection goes at the speed already learned.
net.ipv4.tcp_slow_start_after_idle = 0
